<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إدارة الشكاوي - عقارك</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <script src="admin-auth.js"></script>
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="apple-touch-icon" href="logo.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

        "@type": "RealEstateAgent",

        "name": "منصة عقارك - Aqarak",

        "alternateName": ["Aqarak SA", "شركة عقارك", "Aqarak Real Estate"],

        "url": "https://aqarak.sa",

        "logo": "https://aqarak.sa/logo.jpg",

        "image": "https://aqarak.sa/logo.jpg",

        "description": "منصة عقارك هي الوجهة الأولى لبيع وشراء وإيجار العقارات في السعودية بأقل عمولة. نحن شركة متخصصة في توفير حلول عقارية ذكية وسريعة.",

        "address": {
          "@type": "PostalAddress",

          "addressLocality": "Cairo",

          "addressCountry": "EG"
        },

        "priceRange": "$",

        "contactPoint": {
          "@type": "ContactPoint",

          "telephone": "+966500000000",

          "contactType": "customer service",

          "areaServed": "EG",

          "availableLanguage": ["Arabic"]
        },

        "sameAs": [
          "https://www.facebook.com/share/1ADgNDLXc6/",

          "https://www.instagram.com/aqarak.eg?igsh=eDN2d2tuNmxhazY5",

          "https://whatsapp.com/channel/0029Vb6YH08CxoAoe7aaSP38"
        ]
      }
    </script>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      :root {
        --glass-bg: rgba(20, 20, 20, 0.98);
        --neon-primary: #00ff88;
        --neon-secondary: #00d4ff;
        --neon-danger: #ff4444;
        --card-bg: #1a1a1a;
      }

      body.internal-page {
        background-color: #0f0f0f;
        background-image: radial-gradient(
          circle at 50% 0%,
          #1a2c25 0%,
          #0f0f0f 70%
        );
        min-height: 100vh;
        font-family: "Cairo", sans-serif;
        color: white;
        overflow-x: hidden;
        padding-top: 100px !important;
      }

      .main-header {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        right: 0 !important;
        width: 100% !important;
        z-index: 9999;
        background: var(--glass-bg);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        padding: 10px 15px;
        box-shadow: 0 2px 15px rgba(0, 0, 0, 0.5);
      }

      .header-container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 1250px;
        margin: 0 auto;
        width: 100%;
      }

      .logo-container {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
      }
      .logo {
        height: 40px;
        border-radius: 50%;
        border: 2px solid var(--neon-danger);
      }
      .logo-text {
        color: white;
        font-weight: bold;
        font-size: 1.1rem;
      }

      .nav-button {
        text-decoration: none;
        color: white;
        border: 1px solid var(--neon-danger);
        padding: 6px 20px;
        border-radius: 50px;
        font-size: 0.85rem;
        transition: 0.3s;
        display: flex;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
        cursor: pointer;
      }
      .nav-button:hover {
        background: var(--neon-danger);
        color: white;
      }

      .main-content {
        max-width: 800px;
        margin: 0 auto;
        padding: 20px 15px;
      }

      .page-title {
        text-align: center;
        margin-bottom: 40px;
        font-size: 2rem;
        color: var(--neon-danger);
        text-shadow: 0 0 15px rgba(255, 68, 68, 0.3);
      }

      #complaints-list {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .complaint-card {
        background: var(--card-bg);
        border: 1px solid #333;
        border-radius: 16px;
        padding: 25px;
        position: relative;
        overflow: hidden;
        transition: 0.3s;
      }

      .complaint-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 4px;
        background: var(--neon-danger);
      }

      .complaint-card:hover {
        border-color: var(--neon-danger);
        box-shadow: 0 5px 20px rgba(255, 68, 68, 0.15);
      }

      .complaint-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        border-bottom: 1px solid #333;
        padding-bottom: 15px;
        margin-bottom: 15px;
      }

      .user-info h3 {
        font-size: 1.2rem;
        color: white;
        margin: 0 0 5px 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .user-phone {
        color: #888;
        font-family: monospace;
        font-size: 0.95rem;
        display: block;
      }

      .complaint-date {
        font-size: 0.8rem;
        color: #666;
        background: rgba(255, 255, 255, 0.05);
        padding: 5px 10px;
        border-radius: 6px;
      }

      .complaint-body {
        font-size: 1rem;
        line-height: 1.7;
        color: #ddd;
        background: rgba(255, 68, 68, 0.05);
        padding: 15px;
        border-radius: 10px;
        border: 1px dashed rgba(255, 68, 68, 0.3);
        margin-bottom: 20px;
      }

      .actions-row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .action-btn {
        flex: 1;
        padding: 10px;
        border-radius: 50px;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: 0.3s;
        text-decoration: none;
        font-size: 0.9rem;
        min-width: 140px;
      }

      .btn-whatsapp {
        background: transparent;
        border: 1px solid #25d366;
        color: #25d366;
      }
      .btn-whatsapp:hover {
        background: #25d366;
        color: white;
      }

      .btn-delete {
        background: transparent;
        border: 1px solid var(--neon-danger);
        color: var(--neon-danger);
      }
      .btn-delete:hover {
        background: var(--neon-danger);
        color: white;
      }

      .empty-message {
        text-align: center;
        padding: 40px;
        color: #888;
        border: 2px dashed #333;
        border-radius: 15px;
      }

      @media (max-width: 768px) {
        body.internal-page {
          padding-top: 130px !important;
        }
        .complaint-header {
          flex-direction: column;
          gap: 10px;
          align-items: flex-start;
        }
        .logo-text {
          display: none;
        }
        .actions-row {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body class="internal-page">
    <header class="main-header">
      <div class="header-container">
        <div class="logo-container">
          <img src="logo.jpg" alt="شعار عقارك" class="logo" />
          <span class="logo-text">صندوق الشكاوي (Admin)</span>
        </div>
        <nav class="main-nav">
          <a href="admin-home" class="nav-button">
            العودة للرئيسية
            <i class="fas fa-arrow-left" style="margin-right: 5px"></i>
          </a>
        </nav>
      </div>
    </header>

    <main class="main-content">
      <h1 class="page-title">الشكاوي الواردة 📥</h1>

      <div id="complaints-list">
        <p class="empty-message" style="color: var(--neon-danger)">
          جاري تحميل الشكاوي <i class="fas fa-spinner fa-spin"></i>
        </p>
      </div>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        loadComplaints();
      });

      async function loadComplaints() {
        const list = document.getElementById("complaints-list");
        try {
          const res = await fetch("/api/admin/complaints");
          const complaints = await res.json();

          list.innerHTML = "";
          if (complaints.length === 0) {
            list.innerHTML = `
                        <div class="empty-message">
                            <i class="fas fa-check-double" style="font-size:3rem; color:var(--neon-primary); margin-bottom:15px; display:block;"></i>
                            لا توجد شكاوي جديدة حالياً.
                        </div>`;
            return;
          }

          complaints.forEach((c) => {
            const date =
              new Date(c.created_at).toLocaleDateString("ar-EG") +
              " " +
              new Date(c.created_at).toLocaleTimeString("ar-EG", {
                hour: "2-digit",
                minute: "2-digit",
              });

            let cleanPhone = c.user_phone.replace(/\D/g, "");
            if (cleanPhone.startsWith("01")) cleanPhone = "2" + cleanPhone;
            const waLink = `https://wa.me/${cleanPhone}`;

            const html = `
                        <div class="complaint-card" id="card-${c.id}">
                            <div class="complaint-header">
                                <div class="user-info">
                                    <h3><i class="fas fa-user-circle"></i> ${
                                      c.user_name || "مستخدم"
                                    }</h3>
                                    <span class="user-phone"><i class="fas fa-phone-alt"></i> ${
                                      c.user_phone
                                    }</span>
                                </div>
                                <div class="complaint-date"><i class="far fa-clock"></i> ${date}</div>
                            </div>

                            <div class="complaint-body">
                                <i class="fas fa-quote-right" style="color:var(--neon-danger); margin-left:5px; opacity:0.5;"></i>
                                ${c.content}
                            </div>
                            
                            <div class="actions-row">
                                <a href="${waLink}" target="_blank" class="action-btn btn-whatsapp">
                                    <i class="fab fa-whatsapp" style="font-size:1.2rem;"></i> تواصل واتساب
                                </a>
                                <button onclick="deleteComplaint(${
                                  c.id
                                })" class="action-btn btn-delete">
                                    <i class="fas fa-trash-alt"></i> تم الحل (حذف)
                                </button>
                            </div>
                        </div>
                    `;
            list.innerHTML += html;
          });
        } catch (e) {
          list.innerHTML = `<p class="empty-message" style="color:red;">حدث خطأ أثناء تحميل البيانات.</p>`;
        }
      }

      async function deleteComplaint(id) {
        if (!confirm("⚠️ هل أنت متأكد من حذف هذه الشكوى؟\nسيتم حذفها نهائياً."))
          return;

        const btn = document.querySelector(`#card-${id} .btn-delete`);
        const originalHTML = btn.innerHTML;

        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الحذف...';
        btn.disabled = true;

        try {
          const res = await fetch(`/api/admin/complaint/${id}`, {
            method: "DELETE",
          });
          const data = await res.json();

          if (res.ok) {
            const card = document.getElementById(`card-${id}`);
            card.style.opacity = "0";
            card.style.transform = "translateY(20px)";
            setTimeout(() => {
              card.remove();
              if (document.querySelectorAll(".complaint-card").length === 0)
                loadComplaints();
            }, 300);
          } else {
            alert("❌ خطأ: " + data.message);
            btn.innerHTML = originalHTML;
            btn.disabled = false;
          }
        } catch (error) {
          alert("خطأ في الاتصال بالسيرفر");
          btn.innerHTML = originalHTML;
          btn.disabled = false;
        }
      }
    </script>
    <script src="global-alert.js"></script>
  </body>
</html>
