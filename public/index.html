    <style>
      :root {
        --glass-bg: rgba(20, 20, 20, 0.85);
        --neon-primary: #00ff88;
        --neon-secondary: #00d4ff;
        --card-bg: #1a1a1a;
        --text-main: #ffffff;
        --input-bg: rgba(0, 0, 0, 0.5);
      }

      body {
        background-color: #0f0f0f;
        background-image: radial-gradient(
          circle at 50% 0%,
          #1a2c25 0%,
          #0f0f0f 70%
        );
        min-height: 100vh;
        margin: 0;
        padding: 0;
        font-family: "Cairo", sans-serif;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow-x: hidden;
      }

      .auth-container {
        width: 100%;
        max-width: 420px;
        padding: 20px;
      }

      .auth-frame {
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 40px 30px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        position: relative;
        overflow: hidden;
        animation: fadeUpCard 0.8s ease-out;
      }

      .auth-header {
        text-align: center;
        margin-bottom: 30px;
      }

      .auth-logo {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        border: 3px solid var(--neon-primary);
        object-fit: cover;
        margin-bottom: 15px;
        box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        animation: logoPop 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55),
          logoFloat 4s ease-in-out infinite;
      }

      .auth-title {
        font-size: 1.6rem;
        font-weight: 800;
        color: white;
        margin: 0;
        background: linear-gradient(90deg, #ffffff, #00ff88, #ffffff);
        background-size: 200%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        opacity: 0;
        animation: fadeInUp 0.8s ease-out 0.3s forwards,
          shimmer 3s linear infinite;
      }

      .auth-subtitle {
        color: #aaa;
        font-size: 0.95rem;
        margin-top: 8px;
        opacity: 0;
        animation: fadeInUp 0.8s ease-out 0.6s forwards;
      }

      @keyframes logoPop {
        0% {
          transform: scale(0);
          opacity: 0;
        }
        80% {
          transform: scale(1.1);
          opacity: 1;
        }
        100% {
          transform: scale(1);
        }
      }

      @keyframes logoFloat {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes shimmer {
        0% {
          background-position: -200% center;
        }
        100% {
          background-position: 200% center;
        }
      }

      @keyframes fadeUpCard {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .auth-tabs {
        display: flex;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 50px;
        padding: 5px;
        margin-bottom: 30px;
      }
      .tab-btn {
        flex: 1;
        padding: 10px;
        border: none;
        background: transparent;
        color: #888;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        border-radius: 50px;
        transition: 0.3s;
      }
      .tab-btn.active {
        color: black;
        background: var(--neon-primary);
        box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
      }

      .input-group {
        margin-bottom: 20px;
        position: relative;
      }
      .input-group label {
        display: block;
        color: #ccc;
        font-size: 0.85rem;
        margin-bottom: 8px;
        font-weight: bold;
      }
      .neon-input {
        width: 100%;
        padding: 12px 15px 12px 40px;
        background: var(--input-bg);
        border: 1px solid #444;
        border-radius: 12px;
        color: white;
        font-size: 1rem;
        transition: 0.3s;
        box-sizing: border-box;
      }
      .neon-input:focus {
        border-color: var(--neon-primary);
        outline: none;
        box-shadow: 0 0 10px rgba(0, 255, 136, 0.1);
      }

      .btn-submit {
        width: 100%;
        padding: 14px;
        background: linear-gradient(45deg, var(--neon-primary), #00cc6a);
        border: none;
        border-radius: 12px;
        color: black;
        font-weight: bold;
        font-size: 1.1rem;
        cursor: pointer;
        transition: 0.3s;
        margin-top: 10px;
      }
      .btn-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 20px rgba(0, 255, 136, 0.3);
      }
      .btn-submit:disabled {
        background: #444;
        color: #888;
        cursor: not-allowed;
      }

      .error-msg {
        color: #ff4444;
        font-size: 0.8rem;
        margin-top: 5px;
        display: block;
        min-height: 18px;
      }
      .forgot-link {
        display: block;
        text-align: center;
        color: #888;
        font-size: 0.9rem;
        margin-top: 20px;
        text-decoration: none;
        cursor: pointer;
        transition: 0.3s;
      }
      .forgot-link:hover {
        color: var(--neon-primary);
      }

      .password-wrapper {
        position: relative;
      }
      .toggle-password {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: #888;
        cursor: pointer;
        z-index: 10;
        transition: 0.3s;
        font-size: 1.1rem;
      }
      .toggle-password:hover {
        color: var(--neon-primary);
      }

      .validation-icon {
        position: absolute;
        left: 15px;
        top: 42px;
        font-size: 1.1rem;
      }
      .fa-check-circle {
        color: var(--neon-primary);
        display: none;
      }
      .fa-times-circle {
        color: #ff4444;
        display: none;
      }

      .password-strength {
        height: 4px;
        background: #333;
        margin-top: 8px;
        border-radius: 2px;
        overflow: hidden;
      }
      .strength-bar {
        height: 100%;
        width: 0;
        transition: 0.3s;
      }

      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.9);
        z-index: 2000;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(5px);
      }
      .modal-content {
        background: #1c2630;
        padding: 30px;
        border-radius: 20px;
        width: 90%;
        max-width: 400px;
        border: 1px solid var(--neon-primary);
        text-align: center;
        position: relative;
      }
      .close-modal {
        position: absolute;
        top: 15px;
        left: 15px;
        color: white;
        font-size: 1.5rem;
        cursor: pointer;
      }

      @media (max-width: 480px) {
        body {
          align-items: flex-start;
          padding-top: 12vh;
        }
        .auth-frame {
          padding: 30px 20px;
          margin-bottom: 50px;
        }
        .auth-logo {
          width: 80px;
          height: 80px;
        }
        .auth-title {
          font-size: 1.4rem;
        }
      }

      .fade-in {
        animation: fadeInUp 0.5s ease-out;
      }
      @media (max-width: 480px) {
        body {
          align-items: flex-start;
          padding-top: 20px !important;
        }
        .auth-frame {
          padding: 25px 20px;
          margin-top: 10px;
          border-radius: 15px;
        }
        .logo-flip-container {
          width: 70px !important;
          height: 70px !important;
        }
      }

      .logo-flip-container {
        width: 90px;
        height: 90px;
        margin: 0 auto 15px auto;
        position: relative;
        perspective: 1000px;
      }

      .flip-inner {
        position: relative;
        width: 100%;
        height: 100%;
        text-align: center;
        transition: transform 0.8s;
        transform-style: preserve-3d;
        animation: initialFlip 4s ease-in-out forwards;
      }

      .flip-front,
      .flip-back {
        position: absolute;
        width: 100%;
        height: 100%;
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        border-radius: 50%;
        overflow: hidden;
        border: 3px solid var(--neon-primary);
        box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        background: #111;
      }

      .flip-front img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .flip-back {
        transform: rotateY(180deg);
        background: rgba(0, 255, 136, 0.1);
        cursor: pointer;
        flex-direction: column;
        color: var(--neon-primary);
      }
      .flip-back:hover {
        background: rgba(0, 255, 136, 0.2);
      }

      @keyframes initialFlip {
        0% {
          transform: rotateY(0deg);
        }
        30% {
          transform: rotateY(0deg);
        }
        100% {
          transform: rotateY(180deg);
        }
      }

      .modal-buttons-container {
        display: flex;
        gap: 15px;
        justify-content: center;
        margin-top: 25px;
        width: 100%;
      }

      .modal-btn {
        border: none;
        border-radius: 50px;
        padding: 12px 25px;
        font-size: 1rem;
        font-family: "Cairo", sans-serif;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
        flex: 1;
        max-width: 200px;
      }

      .btn-yes {
        background: linear-gradient(45deg, var(--neon-primary), #00cc6a);
        color: black;
        box-shadow: 0 5px 15px rgba(0, 255, 136, 0.2);
      }
      .btn-yes:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0, 255, 136, 0.4);
      }

      .btn-no {
        background: #333;
        color: #ccc;
        border: 1px solid #444;
      }
      .btn-no:hover {
        background: #444;
        color: white;
        border-color: #666;
      }

      @media (max-width: 480px) {
        .modal-buttons-container {
          flex-direction: column;
          gap: 10px;
        }

        .modal-btn {
          width: 100%;
          max-width: 100%;
          padding: 14px;
        }
      }

      .logo-flip-container:not(.disabled-flip):hover .flip-inner {
        transform: rotateY(180deg);
        cursor: pointer;
      }

      .logo-flip-container.disabled-flip {
        pointer-events: none;
        cursor: default;
      }

      .logo-flip-container.disabled-flip .flip-inner {
        transform: rotateY(0deg) !important;
      }
    </style>
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-frame">
        <div class="auth-header">
          <div class="logo-flip-container">
            <div class="flip-inner" id="flip-box">
              <div class="flip-front">
                <img src="logo.jpg" alt="عقارك" />
              </div>
              <div class="flip-back">
                <img
                  id="profile-preview"
                  src=""
                  style="
                    display: none;
                    width: 100%;
                    height: 100%;
                    object-fit: cover;
                  "
                  loading="lazy"
                />
                <div id="upload-placeholder">
                  <i
                    class="fas fa-user"
                    style="font-size: 1.8rem; margin-bottom: 5px"
                  ></i>
                  <i
                    class="fas fa-plus-circle"
                    style="
                      font-size: 0.8rem;
                      position: absolute;
                      bottom: 15px;
                      right: 28px;
                      background: #000;
                      border-radius: 50%;
                    "
                  ></i>
                </div>
              </div>
            </div>
          </div>

          <input
            type="file"
            id="profile-upload"
            accept="image/*"
            hidden
            onchange="previewProfileImage(event)"
          />

          <h1 class="auth-title">مرحباً بك في عقارك</h1>
          <p class="auth-subtitle">بوابتك العقارية الآمنة 🏠</p>
        </div>

        <div class="auth-tabs">
          <button class="tab-btn active" onclick="switchTab('login')">
            تسجيل دخول
          </button>
          <button class="tab-btn" onclick="switchTab('register')">
            حساب جديد
          </button>
        </div>

        <div id="login-form-wrapper" class="fade-in">
          <form id="login-form">
            <div class="input-group">
              <label>رقم الواتساب</label>
              <input
                type="tel"
                id="login-phone"
                class="neon-input"
                placeholder="01xxxxxxxxx"
                required
                maxlength="11"
                pattern="[0-9]{11}"
                oninvalid="this.setCustomValidity('من فضلك أدخل رقم هاتف صحيح (11 رقم)')"
                oninput="this.setCustomValidity(''); this.value = this.value.replace(/[^0-9]/g, '')"
              />
              <span id="login-phone-error" class="error-msg"></span>
            </div>
            <div class="input-group">
              <label>كلمة المرور</label>
              <div class="password-wrapper">
                <input
                  type="password"
                  id="login-password"
                  class="neon-input"
                  placeholder="••••••••"
                  required
                  oninvalid="this.setCustomValidity('يرجى إدخال كلمة المرور')"
                  oninput="this.setCustomValidity('')"
                />
                <i
                  class="fas fa-eye toggle-password"
                  onclick="togglePassword('login-password', this)"
                ></i>
              </div>
              <span id="login-pass-error" class="error-msg"></span>
            </div>
            <button type="submit" class="btn-submit">دخول</button>
            <span class="forgot-link" onclick="openForgotModal()"
              >نسيت كلمة المرور؟</span
            >
          </form>
        </div>
        <div id="register-form-wrapper" class="fade-in" style="display: none">
          <form id="register-form">
            <div id="reg-step-1">
              <div class="input-group">
                <label>الاسم بالكامل</label>
                <input
                  type="text"
                  id="reg-name"
                  class="neon-input"
                  required
                  oninvalid="this.setCustomValidity('من فضلك اكتب اسمك بالكامل')"
                  oninput="this.setCustomValidity('')"
                />
              </div>

              <div class="input-group">
                <label>اسم المستخدم (إنجليزي فقط)</label>
                <div style="position: relative">
                  <input
                    type="text"
                    id="reg-username"
                    class="neon-input"
                    placeholder="username"
                    minlength="3"
                    required
                    oninvalid="this.setCustomValidity('يرجى اختيار اسم مستخدم (حروف إنجليزية وأرقام فقط)')"
                    oninput="this.setCustomValidity(''); this.value = this.value.toLowerCase().replace(/[^a-z0-9_.]/g, '')"
                  />
                  <i
                    id="icon-check"
                    class="fas fa-check-circle validation-icon"
                  ></i>
                  <i
                    id="icon-error"
                    class="fas fa-times-circle validation-icon"
                  ></i>
                </div>
                <span id="username-msg" class="error-msg"></span>
              </div>

              <div class="input-group">
                <label>رقم الواتساب</label>
                <input
                  type="tel"
                  id="reg-phone"
                  class="neon-input"
                  placeholder="01xxxxxxxxx"
                  required
                  maxlength="11"
                  pattern="[0-9]{11}"
                  oninvalid="this.setCustomValidity('يجب إدخال 11 رقم')"
                  oninput="this.setCustomValidity(''); this.value = this.value.replace(/[^0-9]/g, '')"
                />
                <span id="reg-phone-error" class="error-msg"></span>
              </div>

              <div class="input-group">
                <label>كلمة المرور</label>
                <div class="password-wrapper">
                  <input
                    type="password"
                    id="reg-password"
                    class="neon-input"
                    onkeyup="checkStrength()"
                    required
                    oninvalid="this.setCustomValidity('يرجى إنشاء كلمة مرور')"
                    oninput="this.setCustomValidity('')"
                  />
                  <i
                    class="fas fa-eye toggle-password"
                    onclick="togglePassword('reg-password', this)"
                  ></i>
                </div>
                <div class="password-strength">
                  <div id="strength-bar" class="strength-bar"></div>
                </div>
                <span
                  id="strength-text"
                  style="
                    font-size: 0.75rem;
                    color: #aaa;
                    margin-top: 3px;
                    display: block;
                  "
                ></span>
              </div>

              <div class="input-group">
                <label>تأكيد كلمة المرور</label>
                <div class="password-wrapper">
                  <input
                    type="password"
                    id="reg-confirm-password"
                    class="neon-input"
                    required
                    oninvalid="this.setCustomValidity('يرجى تأكيد كلمة المرور')"
                    oninput="this.setCustomValidity('')"
                  />
                  <i
                    class="fas fa-eye toggle-password"
                    onclick="togglePassword('reg-confirm-password', this)"
                  ></i>
                </div>
                <span id="confirm-pass-error" class="error-msg"></span>
              </div>
            </div>

            <div
              class="input-group"
              id="reg-otp-group"
              style="display: none; animation: fadeInUp 0.5s"
            >
              <label style="color: var(--neon-primary)"
                >✨ تم إرسال الكود للواتساب</label
              >
              <input
                type="text"
                id="reg-otp"
                class="neon-input"
                placeholder="أدخل الكود (4 أرقام)"
                style="
                  text-align: center;
                  letter-spacing: 5px;
                  font-size: 1.2rem;
                "
              />
            </div>

            <button type="submit" class="btn-submit" id="reg-submit-btn">
              إنشاء الحساب
            </button>
          </form>
        </div>
        <div id="forgotModal" class="modal">
          <div class="modal-content">
            <span class="close-modal" onclick="closeForgotModal()"
              >&times;</span
            >
            <h3 style="color: var(--neon-secondary); margin-bottom: 20px">
              استعادة كلمة المرور
            </h3>
            <p
              id="forgot-message"
              style="color: #ccc; font-size: 0.9rem; margin-bottom: 20px"
            ></p>

            <div id="forgot-step-1">
              <input
                type="tel"
                id="forgot-phone"
                class="neon-input"
                placeholder="رقم الواتساب المسجل"
                style="margin-bottom: 15px"
              />
              <button class="btn-submit" onclick="sendForgotOTP()">
                أرسل كود التحقق
              </button>
            </div>

            <div id="forgot-step-2" style="display: none">
              <input
                type="text"
                id="forgot-otp"
                class="neon-input"
                placeholder="الكود"
                style="margin-bottom: 10px; text-align: center"
              />
              <div class="password-wrapper" style="margin-bottom: 15px">
                <input
                  type="password"
                  id="new-password"
                  class="neon-input"
                  placeholder="كلمة المرور الجديدة"
                />
                <i
                  class="fas fa-eye toggle-password"
                  onclick="togglePassword('new-password', this)"
                ></i>
              </div>
              <button class="btn-submit" onclick="resetPassword()">
                تغيير كلمة المرور
              </button>
            </div>
          </div>
        </div>

        <div id="warningModal" class="modal">
          <div class="modal-content" style="border-color: #ffaa00">
            <span class="close-modal" onclick="closeWarningModal()"
              >&times;</span
            >
            <div style="text-align: center">
              <i
                class="fas fa-exclamation-triangle"
                style="font-size: 3rem; color: #ffaa00; margin-bottom: 15px"
              ></i>
              <h3 style="color: white; margin-bottom: 10px">تنبيه</h3>
              <p
                id="warning-message"
                style="color: #ccc; font-size: 1.1rem; margin-bottom: 20px"
              ></p>
              <button
                class="btn-submit"
                onclick="closeWarningModal()"
                style="background: #ffaa00; color: #000"
              >
                حسناً
              </button>
            </div>
          </div>
        </div>

        <div id="notFoundModal" class="modal">
          <div
            class="modal-content"
            style="border-color: var(--neon-secondary)"
          >
            <span class="close-modal" onclick="closeNotFoundModal()"
              >&times;</span
            >
            <div style="text-align: center">
              <i
                class="fas fa-user-plus"
                style="
                  font-size: 3.5rem;
                  color: var(--neon-secondary);
                  margin-bottom: 20px;
                  animation: logoFloat 3s infinite ease-in-out;
                "
              ></i>
              <h3 style="color: white; margin-bottom: 10px">الرقم غير مسجل</h3>
              <p
                style="
                  color: #ccc;
                  font-size: 1rem;
                  margin-bottom: 25px;
                  line-height: 1.6;
                "
              >
                هذا الرقم غير موجود في قاعدة بياناتنا.<br />
                هل ترغب في إنشاء حساب جديد باستخدام الرقم
                <span
                  id="modal-phone-display"
                  style="color: var(--neon-primary); font-weight: bold"
                ></span
                >؟
              </p>

              <div class="modal-buttons-container">
                <button
                  class="modal-btn btn-yes"
                  onclick="confirmCreateAccount()"
                >
                  نعم، إنشاء حساب
                </button>

                <button class="modal-btn btn-no" onclick="closeNotFoundModal()">
                  لا، شكراً
                </button>
              </div>
            </div>
          </div>
        </div>

        <script src="script.js" defer></script>
        <script src="ban-check.js" defer></script>
        <script src="global-alert.js" defer></script>
      </div>
    </div>
  </body>
</html>
